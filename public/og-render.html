<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 80px;
      padding: 0 80px;
      position: relative;
    }

    /* Subtle background glows */
    body::before {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(207,10,44,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,40,104,0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Logo mark: exact SVG from Logo.jsx ── */
    .logo-mark {
      flex-shrink: 0;
    }

    /* ── Wordmark ── */
    .wordmark {
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }
    .wm-vota {
      font-family: 'Big Shoulders Display', Impact, 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 200px;
      line-height: 0.88;
      color: #CF0A2C;
      letter-spacing: -2px;
    }
    .wm-divider {
      width: 100%;
      height: 2px;
      background: rgba(207,10,44,0.45);
      margin: 10px 0 8px;
    }
    .wm-boricua {
      font-family: 'Big Shoulders Display', Impact, 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 115px;
      line-height: 1;
      color: rgba(255,255,255,0.88);
      letter-spacing: 3px;
    }
    .wm-tagline {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.38);
      margin-top: 22px;
      text-transform: uppercase;
    }
    .wm-url {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 20px;
      color: rgba(255,255,255,0.18);
      margin-top: 10px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- EXACT logo SVG from Logo.jsx — viewBox 0 0 280 305 -->
  <svg
    class="logo-mark"
    width="220"
    height="240"
    viewBox="0 0 280 305"
    xmlns="http://www.w3.org/2000/svg"
  >
    <!-- Left arm — RED triangle (exact points from Logo.jsx) -->
    <polygon points="10,10 96,10 140,290" fill="#CF0A2C"/>
    <!-- Right arm — PR blue triangle (exact points from Logo.jsx) -->
    <polygon points="270,10 184,10 140,290" fill="#3F76BC"/>
    <!-- White PR star (exact points from Logo.jsx) -->
    <polygon points="140,220 147,239 167,239 151,251 157,271 140,259 124,271 130,251 113,239 134,239" fill="#FFFFFF"/>
  </svg>

  <!-- Wordmark -->
  <div class="wordmark">
    <span class="wm-vota">VOTA</span>
    <div class="wm-divider"></div>
    <span class="wm-boricua">BORICUA</span>
    <span class="wm-tagline">Si Votas, Te Votas.</span>
    <span class="wm-url">sivotastevotas.com</span>
  </div>

</body>
</html>
