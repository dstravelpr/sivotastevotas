    <!-- ═══ STRUCTURED DATA: FAQPage (Featured Snippets) ═════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cuándo son las próximas elecciones en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Las próximas elecciones generales de Puerto Rico son el 7 de noviembre de 2028. Se elegirá gobernador/a, legisladores y alcaldes de los 78 municipios."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo me registro para votar en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puedes registrarte a votar en la Comisión Estatal de Elecciones (CEE) visitando ceepur.org. El proceso puede completarse en línea o en persona en las oficinas del CEE de tu municipio. Debes ser ciudadano/a de EE.UU. mayor de 18 años y residente de Puerto Rico."
          }
        },
        {
          "@type": "Question",
          "name": "¿Por qué es importante votar en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tu voto elige al gobernador/a, legisladores y alcaldes que deciden sobre energía (LUMA), costo de vida, seguridad pública, vivienda y el estatus político de Puerto Rico. En las elecciones de 2024, más del 40% de los votantes registrados no participó. Esos votos ausentes definen quién gobierna."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la fecha límite para registrarse a votar en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La Comisión Estatal de Elecciones (CEE) generalmente cierra el registro de votantes 50 días antes de las elecciones generales. Para las elecciones de noviembre de 2028, la fecha límite tentativa es septiembre de 2028. Regístrate con tiempo para no quedarte fuera."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo votar por correo en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Puerto Rico ofrece la opción de voto ausente (por correo) para electores que califican, incluyendo personas con impedimentos físicos, empleados del gobierno fuera del país, y militares. Debes solicitarlo a la CEE con anticipación antes de la elección."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo debo decidir por quién votar en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vota por la persona, no por el partido. Investiga el récord real de cada candidato (lo que ha hecho, no lo que promete), quién financia su campaña, sus posturas en los temas que te importan (agua, energía, economía, estatus) y su nivel de transparencia ante señalamientos o investigaciones. Desde 2020, el FBI ha arrestado a funcionarios de distintos partidos en Puerto Rico por corrupción, por lo que la afiliación partidista no garantiza honestidad. Tu defensa más poderosa contra la corrupción es un voto informado: elige a quien mejor se alinee con tus valores, sin importar el color de la papeleta."
          }
        },
        {
          "@type": "Question",
          "name": "¿Quién nombra al Secretario de la Gobernación en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Secretario o Secretaria de la Gobernación es nombrado directamente por el gobernador o gobernadora de Puerto Rico, sin necesidad de confirmación por la Asamblea Legislativa. Es uno de los puestos más poderosos del gobierno: tiene autoridad amplia sobre nombramientos en las agencias y sobre procesos de contratación, incluyendo contratos pagados con fondos federales. Como la ciudadanía no elige ni confirma este puesto, la única forma de influir sobre quién lo ocupa es eligiendo al gobernador o gobernadora que lo nombra — eso ocurre en las elecciones generales."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué tiene que ver la crisis del agua con las elecciones en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todo. La Autoridad de Acueductos y Alcantarillados (AAA) es una corporación pública cuya Junta de Gobierno es nombrada por el gobernador o gobernadora electa. La crisis de agua de 2026 — con más de 100,000 clientes afectados por averías en el Superacueducto y el deterioro de la planta Sergio Cuevas — es consecuencia de décadas de falta de inversión en infraestructura, una decisión política. El voto en las elecciones de 2028 determina quién dirige la AAA y cuánto se invierte en el agua potable de Puerto Rico."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuántas personas votan en Puerto Rico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En las elecciones generales de 2024, aproximadamente 1.4 millones de personas votaron de un padrón de cerca de 2.3 millones de votantes registrados — una participación de alrededor del 58%. Históricamente, Puerto Rico ha tenido participaciones de hasta el 80%, pero ha caído significativamente en las últimas décadas."
          }
        }
      ]
